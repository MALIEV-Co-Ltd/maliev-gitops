apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ../../3-apps/_legacy-postgres/overlays/legacy
  - ../../3-apps/_legacy-redis/overlays/legacy
  - ../../3-apps/_legacy-data-migration-shadow-foundation/overlays/legacy
patches:
  - path: migration-roles-patch.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: legacy-postgres-main

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-maliev-intranet-runtime
  labels:
    app.kubernetes.io/name: legacy-maliev-intranet
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-maliev-intranet-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ConnectionStrings__redis: >-
          legacy-redis:6379,password={{ .redisPassword }},ssl=false,
          abortConnect=false
        DataProtection__CertificatePfxBase64: "{{ .dataProtectionCertificate }}"
        DataProtection__CertificatePassword: "{{ .dataProtectionPassword }}"
        Jwt__PublicKey: "{{ .jwtPublicKey }}"
        Jwt__Issuer: "{{ .jwtIssuer }}"
        Jwt__Audience: "{{ .jwtAudience }}"
        Jwt__KeyId: "{{ .jwtKeyId }}"
        ServiceAuthentication__ClientId: legacy-intranet
        ServiceAuthentication__ClientSecret: "{{ .serviceClientSecret }}"
        Authentication__Google__ClientId: "{{ .googleClientId }}"
        GoogleMaps__BrowserApiKey: "{{ .googleMapsBrowserKey }}"
  data:
    - secretKey: redisPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-redis-password
    - secretKey: dataProtectionCertificate
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-intranet-data-protection-certificate-pfx-base64
    - secretKey: dataProtectionPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-intranet-data-protection-certificate-password
    - secretKey: jwtPublicKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-public-key
    - secretKey: jwtIssuer
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-issuer
    - secretKey: jwtAudience
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-audience
    - secretKey: jwtKeyId
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-key-id
    - secretKey: serviceClientSecret
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-intranet-service-client-secret
    - secretKey: googleClientId
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-google-identity-client-id
    - secretKey: googleMapsBrowserKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-intranet-google-maps-browser-api-key

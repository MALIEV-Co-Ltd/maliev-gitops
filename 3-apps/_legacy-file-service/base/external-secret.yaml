apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-maliev-file-runtime
  labels:
    app.kubernetes.io/name: legacy-maliev-file-service
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-maliev-file-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        FileStorage__AllowedBuckets__0: maliev.com
        FileStorage__AllowedBuckets__1: maliev-instant-quotations
        FileStorage__AllowedBuckets__2: maliev-quotation-requests
        FileStorage__QuarantinePrefix: _quarantine
        FileStorage__SignedUrlHours: "168"
        ConnectionStrings__FileDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=Upload;
          Username={{ .uploadUsername }};Password={{ .uploadPassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        Jwt__PublicKey: "{{ .jwtPublicKey }}"
        Jwt__Issuer: "{{ .jwtIssuer }}"
        Jwt__Audience: "{{ .jwtAudience }}"
        MalwareScanner__Host: legacy-clamav
        MalwareScanner__Port: "3310"
  data:
    - secretKey: uploadUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-upload-username
    - secretKey: uploadPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-upload-password
    - secretKey: jwtPublicKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-public-key
    - secretKey: jwtIssuer
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-issuer
    - secretKey: jwtAudience
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-audience

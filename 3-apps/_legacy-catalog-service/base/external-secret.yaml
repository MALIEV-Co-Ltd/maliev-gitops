apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-maliev-catalog-runtime
  labels:
    app.kubernetes.io/name: legacy-maliev-catalog-service
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-maliev-catalog-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ConnectionStrings__CatalogDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=Material;
          Username={{ .materialUsername }};Password={{ .materialPassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        ConnectionStrings__redis: "legacy-redis:6379,password={{ .redisPassword }},ssl=false,abortConnect=false"
        Jwt__PublicKey: "{{ .jwtPublicKey | b64enc }}"
        Jwt__Issuer: "{{ .jwtIssuer }}"
        Jwt__Audience: "{{ .jwtAudience }}"
  data:
    - secretKey: materialUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-material-username
    - secretKey: materialPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-material-password
    - secretKey: redisPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-redis-password
    - secretKey: jwtPublicKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-public-key
    - secretKey: jwtIssuer
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-issuer
    - secretKey: jwtAudience
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-audience

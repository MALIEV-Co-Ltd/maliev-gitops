apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-maliev-accounting-runtime
  labels:
    app.kubernetes.io/name: legacy-maliev-accounting-service
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-maliev-accounting-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ConnectionStrings__PaymentDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=Payment;
          Username={{ .paymentUsername }};Password={{ .paymentPassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        ConnectionStrings__InvoiceDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=Invoice;
          Username={{ .invoiceUsername }};Password={{ .invoicePassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        ConnectionStrings__ReceiptDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=Receipt;
          Username={{ .receiptUsername }};Password={{ .receiptPassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        ConnectionStrings__redis: >-
          legacy-redis:6379,password={{ .redisPassword }},ssl=false,
          abortConnect=false
        Jwt__PublicKey: "{{ .jwtPublicKey | b64enc }}"
        Jwt__Issuer: "{{ .jwtIssuer }}"
        Jwt__Audience: "{{ .jwtAudience }}"
        ServiceAuthentication__ClientId: legacy-accounting
        ServiceAuthentication__ClientSecret: "{{ .serviceClientSecret }}"
  data:
    - secretKey: paymentUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-payment-username
    - secretKey: paymentPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-payment-password
    - secretKey: invoiceUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-invoice-username
    - secretKey: invoicePassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-invoice-password
    - secretKey: receiptUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-receipt-username
    - secretKey: receiptPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-receipt-password
    - secretKey: redisPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-redis-password
    - secretKey: jwtPublicKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-public-key
    - secretKey: jwtIssuer
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-issuer
    - secretKey: jwtAudience
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-audience
    - secretKey: serviceClientSecret
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-accounting-service-client-secret

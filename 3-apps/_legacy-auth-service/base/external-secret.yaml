apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-maliev-auth-runtime
  labels:
    app.kubernetes.io/name: legacy-maliev-auth-service
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-maliev-auth-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ConnectionStrings__CustomerIdentity: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=CustomerIdentity;
          Username={{ .customerIdentityUsername }};Password={{ .customerIdentityPassword }};
          SSL Mode=Disable;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        ConnectionStrings__EmployeeIdentity: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=EmployeeIdentity;
          Username={{ .employeeIdentityUsername }};Password={{ .employeeIdentityPassword }};
          SSL Mode=Disable;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        ConnectionStrings__RefreshSessions: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=Auth;
          Username={{ .refreshSessionsUsername }};Password={{ .refreshSessionsPassword }};
          SSL Mode=Disable;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        Jwt__Issuer: "{{ .jwtIssuer }}"
        Jwt__Audience: "{{ .jwtAudience }}"
        Jwt__PrivateKeyPem: "{{ .jwtPrivateKey }}"
        Jwt__KeyId: "{{ .jwtKeyId }}"
        GoogleIdentity__Employee__HostedDomain: "{{ .googleHostedDomain }}"
        GoogleIdentity__Employee__Audiences__intranet: "{{ .googleIntranetAudience }}"
        Authentication__Google__ClientId: "{{ .googleClientId }}"
        ServiceClients__Clients__legacy-accounting__SecretSha256: "{{ .accountingClientHash }}"
        ServiceClients__Clients__legacy-intranet__SecretSha256: "{{ .intranetClientHash }}"
        ServiceClients__Clients__legacy-quotation__SecretSha256: "{{ .quotationClientHash }}"
        ServiceClients__Clients__legacy-web__SecretSha256: "{{ .webClientHash }}"
  data:
    - secretKey: customerIdentityUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-customer-identity-username
    - secretKey: customerIdentityPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-customer-identity-password
    - secretKey: employeeIdentityUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-employee-identity-username
    - secretKey: employeeIdentityPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-employee-identity-password
    - secretKey: refreshSessionsUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-auth-refresh-sessions-username
    - secretKey: refreshSessionsPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-auth-refresh-sessions-password
    - secretKey: jwtIssuer
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-issuer
    - secretKey: jwtAudience
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-audience
    - secretKey: jwtPrivateKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-private-key
    - secretKey: jwtKeyId
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-key-id
    - secretKey: googleHostedDomain
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-google-identity-employee-hosted-domain
    - secretKey: googleIntranetAudience
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-google-identity-employee-audience-intranet
    - secretKey: googleClientId
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-google-identity-client-id
    - secretKey: accountingClientHash
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-service-client-legacy-accounting-secret-sha256
    - secretKey: intranetClientHash
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-service-client-legacy-intranet-secret-sha256
    - secretKey: quotationClientHash
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-service-client-legacy-quotation-secret-sha256
    - secretKey: webClientHash
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-service-client-legacy-web-secret-sha256

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-quotation-migration-role
  namespace: maliev-legacy
  labels:
    app.kubernetes.io/name: legacy-quotation-migration
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-postgres-quotation-migrator
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-quotation-migrator-username
    - secretKey: password
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-quotation-migrator-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-quotation-request-migration-role
  namespace: maliev-legacy
  labels:
    app.kubernetes.io/name: legacy-quotation-migration
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-postgres-quotation-request-migrator
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-quotation-request-migrator-username
    - secretKey: password
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-quotation-request-migrator-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-quotation-migration-runtime
  namespace: maliev-legacy
  labels:
    app.kubernetes.io/name: legacy-quotation-migration
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-quotation-migration-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ConnectionStrings__QuotationDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=Quotation;
          Username={{ .quotationMigratorUsername }};Password={{ .quotationMigratorPassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=false
        ConnectionStrings__QuotationRequestDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=QuotationRequest;
          Username={{ .quotationRequestMigratorUsername }};Password={{ .quotationRequestMigratorPassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=false
        trusted-public-key.pem: "{{ .trustedPublicKey }}"
        trusted-key-id: "{{ .trustedKeyId }}"
  data:
    - secretKey: quotationMigratorUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-quotation-migrator-username
    - secretKey: quotationMigratorPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-quotation-migrator-password
    - secretKey: quotationRequestMigratorUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-quotation-request-migrator-username
    - secretKey: quotationRequestMigratorPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-quotation-request-migrator-password
    - secretKey: trustedPublicKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-quotation-schema-baseline-public-key
    - secretKey: trustedKeyId
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-quotation-schema-baseline-key-id

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-maliev-employee-runtime
  labels:
    app.kubernetes.io/name: legacy-maliev-employee-service
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-maliev-employee-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ConnectionStrings__EmployeeDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=Employee;
          Username={{ .employeeUsername }};Password={{ .employeePassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        ConnectionStrings__redis: >-
          legacy-redis:6379,password={{ .redisPassword }},ssl=false,
          abortConnect=false
        Jwt__PublicKey: "{{ .jwtPublicKey }}"
        Jwt__Issuer: "{{ .jwtIssuer }}"
        Jwt__Audience: "{{ .jwtAudience }}"
  data:
    - secretKey: employeeUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-employee-username
    - secretKey: employeePassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-employee-password
    - secretKey: redisPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-redis-password
    - secretKey: jwtPublicKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-public-key
    - secretKey: jwtIssuer
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-issuer
    - secretKey: jwtAudience
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-audience

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-maliev-order-runtime
  labels:
    app.kubernetes.io/name: legacy-maliev-order-service
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-maliev-order-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ConnectionStrings__OrderDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=Order;
          Username={{ .orderUsername }};Password={{ .orderPassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        ConnectionStrings__OrderStatusDbContext: >-
          Host=legacy-postgres-pooler-rw;Port=5432;Database=OrderStatus;
          Username={{ .orderStatusUsername }};Password={{ .orderStatusPassword }};
          SSL Mode=Require;Trust Server Certificate=true;Pooling=true;
          Minimum Pool Size=0;Maximum Pool Size=20
        ConnectionStrings__redis: "legacy-redis:6379,password={{ .redisPassword }},ssl=false,abortConnect=false"
        Jwt__PublicKey: "{{ .jwtPublicKey | b64enc }}"
        Jwt__Issuer: "{{ .jwtIssuer }}"
        Jwt__Audience: "{{ .jwtAudience }}"
  data:
    - secretKey: orderUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-order-username
    - secretKey: orderPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-order-password
    - secretKey: orderStatusUsername
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-order-status-username
    - secretKey: orderStatusPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-postgres-order-status-password
    - secretKey: redisPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-redis-password
    - secretKey: jwtPublicKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-public-key
    - secretKey: jwtIssuer
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-issuer
    - secretKey: jwtAudience
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-jwt-audience

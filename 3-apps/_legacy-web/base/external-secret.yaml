apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: legacy-maliev-web-runtime
  labels:
    app.kubernetes.io/name: legacy-maliev-web
    app.kubernetes.io/part-of: maliev-legacy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: legacy-maliev-web-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ConnectionStrings__redis: >-
          legacy-redis:6379,password={{ .redisPassword }},ssl=false,
          abortConnect=false
        DataProtection__CertificatePfxBase64: "{{ .dataProtectionCertificate }}"
        DataProtection__CertificatePassword: "{{ .dataProtectionPassword }}"
        ServiceAuthentication__ClientId: legacy-web
        ServiceAuthentication__ClientSecret: "{{ .serviceClientSecret }}"
        Recaptcha__SiteKey: "{{ .recaptchaSiteKey }}"
        Recaptcha__ProjectId: "{{ .recaptchaProjectId }}"
        GoogleMaps__EmbedApiKey: "{{ .googleMapsEmbedApiKey }}"
  data:
    - secretKey: redisPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-redis-password
    - secretKey: dataProtectionCertificate
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-web-data-protection-certificate-pfx-base64
    - secretKey: dataProtectionPassword
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-web-data-protection-certificate-password
    - secretKey: serviceClientSecret
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-web-service-client-secret
    - secretKey: recaptchaSiteKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-web-recaptcha-site-key
    - secretKey: recaptchaProjectId
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-web-recaptcha-project-id
    - secretKey: googleMapsEmbedApiKey
      remoteRef:
        key: maliev-legacy-secrets
        property: legacy-web-google-maps-embed-api-key
